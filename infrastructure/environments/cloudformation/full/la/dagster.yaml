AWSTemplateFormatVersion: 2010-09-09
Description: |
  This template manages the dagster implementation which involves three instances:
  A dagit instance (used for managing job runs), A daemon instance (used for sensing and scheduling), and a
  code server (used for running pipelines).
Parameters:

  # Project-level Parameters
  ProjectName:
    Type: String
    Default: Dagster
    Description: Name of the la. Used to name things like database, etc.
  OrganisationName:
    Type: String
    Default: org
    Description: The name of the council, authority, or organisation this is for
  LogRetentionTimeDays:
    Type: String
    Default: 30
    Description: The number of days to store Cloudwatch Logs

  # Environment Parameters
  Environment:
    Type: String
    Default: ""
    AllowedValues:
      - ""
      - dev
      - staging
      - prod
      - test
    Description: The name for the environment. 

  # ECS Parameters
  DaemonCpu:
    Type: String
    Default: 256
    Description: CPU to use for Daemon
  DagitCpu:
    Type: String
    Default: 256
    Description: CPU to use for Dagit
  CodeServerCpu:
    Type: String
    Default: 256
    Description: CPU to use for Code Server
  DaemonMemory:
    Type: String
    Default: 1024
    Description: Memory to use for Daemon
  DagitMemory:
    Type: String
    Default: 1024
    Description: Memory to use for Dagit
  CodeServerMemory:
    Type: String
    Default: 1024
    Description: CPU to use for the Code Server
  DaemonImagePath:
    Type: String
    Default: ""
    Description: Docker hub image:Version or ECR URL in format aws_account_id.dkr.ecr.region.amazonaws.com/my-repository:latest
  DagitImagePath:
    Type: String
    Default: ""
    Description: Docker hub image:Version or ECR URL in format aws_account_id.dkr.ecr.region.amazonaws.com/my-repository:latest
  UserCode1ImagePath:
    Type: String
    Default: ""
    Description: Docker hub image:Version or ECR URL in format aws_account_id.dkr.ecr.region.amazonaws.com/my-repository:latest
  DaemonLaunchType:
    Type: String
    Default: "FARGATE"
    Description: Either FARGATE or EC2 type can be used
  DagitLaunchType:
    Type: String
    Default: "FARGATE"
    Description: Either FARGATE or EC2 type can be used
  CodeServerLaunchType:
    Type: String
    Default: "FARGATE"
    Description: Either FARGATE or EC2 type can be used
  CodeServerPipelineFolder:
    Type: String
    Default: "pipeline"
    Description: What folder the repo exists in on the code server
  CodeServerPipelineRepoLocation:
    Type: String
    Default: "repository.py"
    Description: Location of the repo.py file that controls the repository

  # Dagster Parameters
  InputLocation:
    Type: String
    Description: |
      The standard location to look for files to ingest into the pipelines. For s3, this must be a ROOT path, no folders
      Example: s3://my-bucket-name
  WorkspaceLocation:
    Type: String
    Description: The standard output location for pipeline files. For s3, this must be a ROOT path, no folders.
  OutputLocation:
    Type: String
    Description: The location to surface files for the org account
  ExternalDataLocation:
    Type: String
    Description: Location of external data to be used for the pipeline
  CleanPipelineSchedule:
    Type: String
    Description: The CRON string used to determine how often the clean file pipeline should run
    Default: "0 0 * * 1-5"
  ReportsPipelineSchedule:
    Type: String
    Description: The CRON string used to determine how often the Reports pipeline should run. Note that This should never run on the LA instance, so default is date that should never happen.
    Default: "0 0 31 2 *"
  AllowedDatasets:
    Type: String
    Description: Which datasets to allow to run on the system
    Default: "ssda903,cin"
  RegionConfig:
    Type: String
    Description: Name of the region to pull configuration file e.g. gmca or eoe
  ConfigSchedule:
    Type: String
    Description: Schedule that logs the config file for any allowed datasets
  SensorMinimumInterval:
    Type: String
    Description: Interval (in seconds) between sensor evaluations
    Default: 3600
  DagsterGRPCTimeout:
    Type: String
    Description: The time (in seconds) the dagster daemon will wait for sensors and schedules to complete.
    Default: 60
  HashSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the HMAC hashing key
  HashSecretVersion:
    Type: String
    Default: "1"
    Description: Version identifier for the hashing key

  # Database Parameters
  DBName:
    Type: String
    Default: postgres
    Description: The name to be used for the database
  DBPort:
    Type: String
    Default: 3306
    Description: The port to use to connect to the database
  DatabaseEndpoint:
    Type: String
    Description: Endpoint address of the existing Aurora database cluster
  DBUsername:
    Type: String
    Default: postgres
    Description: Username to use with the database
  DBPasswordArn:
    Type: String
    Description: ARN ref to the Password to use with the database    

  # Networking Parameters
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the Dagster resources
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for the shared Aurora database
  PrivateSubnet1:
    Type: String
    Description: ARN for private subnet 1
  PrivateSubnet2:
    Type: String
    Description: ARN for private subnet 2
  ServiceDiscoveryNamespaceArn:
    Type: String
    Description: ARN of the Cloud Map namespace

Conditions:
  HasEnvironment: !Not [!Equals [!Ref Environment, ""]]

Resources:

  # Discovery Service link for Dagster Web Server
  DagsterWebserverDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: dagster-webserver
      NamespaceId: !Ref ServiceDiscoveryNamespaceArn 
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
        RoutingPolicy: WEIGHTED
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # Security Groups - Dagster Daemon 
  DaemonSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !If
        - HasEnvironment
        - !Sub "daemon-sg-${Environment}"
        - "daemon-sg"
      GroupDescription: "Security group for the dagster daemon"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1

  # Security Groups - Dagster CodeServer 
  CodeServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !If
        - HasEnvironment
        - !Sub "codeserver-sg-${Environment}"
        - "codeserver-sg"
      GroupDescription: "Security Group for the Code Server"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref DaemonSecurityGroup
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref DagitSecurityGroup
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1

  # Security Groups - Dagit CodeServer 
  DagitSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !If
        - HasEnvironment
        - !Sub "dagit-sg-${Environment}"
        - "dagit-sg"
      GroupDescription: "Security Group for the Dagit Interface"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1

  DaemonDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DBPort
      ToPort: !Ref DBPort
      SourceSecurityGroupId: !Ref DaemonSecurityGroup

  DagitDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DBPort
      ToPort: !Ref DBPort
      SourceSecurityGroupId: !Ref DagitSecurityGroup

  CodeServerDatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref DBPort
      ToPort: !Ref DBPort
      SourceSecurityGroupId: !Ref CodeServerSecurityGroup

  # Logging Configuration
  DagitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
        - HasEnvironment
        - !Sub "${ProjectName}-${OrganisationName}-Dagit-LogGroup-${Environment}"
        - !Sub "${ProjectName}-${OrganisationName}-Dagit-LogGroup"
      RetentionInDays: !Ref LogRetentionTimeDays

  CodeServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
      - HasEnvironment
      - !Sub "${ProjectName}-${OrganisationName}-CodeServer-LogGroup-${Environment}"
      - !Sub "${ProjectName}-${OrganisationName}-CodeServer-LogGroup"
      RetentionInDays: !Ref LogRetentionTimeDays

  DaemonLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
        - HasEnvironment
        - !Sub "${ProjectName}-${OrganisationName}-Daemon-LogGroup-${Environment}"
        - !Sub "${ProjectName}-${OrganisationName}-Daemon-LogGroup"
      RetentionInDays: !Ref LogRetentionTimeDays

  # ECS Definition
  DagitTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DagitTaskExecutionSSM
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:GetParameters"
                  - "secretsmanager:GetSecretValue"
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task/*/*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/CodeServerTask:*"
              - Effect: Allow
                Action:
                  - "ecs:DescribeTaskDefinition"
                Resource:
                  - "*"

        - PolicyName: ReadDatabasePassword
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBPasswordArn
      ManagedPolicyArns: # These need to be peared down for security reasons. What is necessary?
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  DagitTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DagitLogHandlingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Action:
                - "logs:CreateLogGroup"
              Resource:
                - "*"
        - PolicyName: DagitTaskHandlingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecs:DescribeTasks"
                  - "ecs:StopTask"
                Resource:
                  - "*"
        - PolicyName: DagitTaskRolePassingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "iam:PassRole"
                Resource:
                  - "*"
                Condition:
                  StringLike:
                    iam:PassedToService: "ecs-tasks.amazonaws.com"
        - PolicyName: DagitDescribeTasksPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ecs:DescribeTaskDefinition"
                Resource:
                  - "*"
      ManagedPolicyArns:        # These need to be peared down for security reasons. What is necessary?
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  DaemonTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: # These need to be peared down for security reasons. What is necessary?
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: ReadDatabasePassword
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBPasswordArn

  DaemonTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DaemonLogHandling
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              Effect: Allow
              Action:
                - "logs:CreateLogGroup"
                - "logs:CreateLogStream"
                - "logs:PutLogEvents"
              Resource:
                - "*"
        - PolicyName: DaemonTaskHandling
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ec2:DescribeNetworkInterfaces"
                  - "ecs:DescribeTaskDefinition"
                  - "ecs:DescribeTasks"
                  - "ecs:ListAccountSettings"
                  - "ecs:RegisterTaskDefinition"
                  - "ecs:RunTask"
                  - "ecs:TagResource"
                  - "secretsmanager:DescribeSecret"
                  - "secretsmanager:ListSecrets"
                  - "secretsmanager:GetSecretValue"
                Resource:
                  - "*"
        - PolicyName: DaemonTaskRolePassing
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "iam:PassRole"
                Resource:
                  - "*"
                Condition:
                  StringLike:
                    iam:PassedToService: "ecs-tasks.amazonaws.com"
      ManagedPolicyArns: # These need to be peared down for security reasons. What is necessary?
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  CodeServerTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasEnvironment
        - !Sub "${ProjectName}-${RegionConfig}-${Environment}-CodeServerTaskExecutionRole"
        - !Sub "${ProjectName}-${RegionConfig}-CodeServerTaskExecutionRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns: # These need to be peared down for security reasons. What is necessary?
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: ReadRemoteSecretDockerCredentials
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "arn:aws:secretsmanager:eu-west-2:260477567664:secret:dockerhub-sysadmin-credentials-5Lb3FI"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "arn:aws:kms:eu-west-2:260477567664:key/69dd8f98-e08c-4410-840f-ab1ea78ef2b2"
        - PolicyName: ReadHashSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref HashSecretArn
        - PolicyName: ReadDatabasePassword
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBPasswordArn
                
  CodeServerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeServerLogHandling
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                Resource:
                  - "*"
      ManagedPolicyArns: # These need to be peared down for security reasons. What is necessary?
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonElasticContainerRegistryPublicReadOnly
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  DagsterCluster:
    Type: AWS::ECS::Cluster
    DependsOn:
      - CodeServerTaskExecutionRole
      - DaemonTaskExecutionRole
      - DagitTaskExecutionRole
    Properties:
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DagsterDaemonTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !If
        - HasEnvironment
        - !Sub "DagsterDaemonTask-${Environment}"
        - "DagsterDaemonTask"
      ExecutionRoleArn: !GetAtt DaemonTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt DaemonTaskRole.Arn
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref DaemonCpu
      Memory: !Ref DaemonMemory
      ContainerDefinitions:
        - Name: dagster-daemon
          Image: !Ref DaemonImagePath
          Memory: !Ref DaemonMemory
          EntryPoint:
            - "dagster-daemon"
            - "run"
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DaemonLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-create-group: true
              awslogs-stream-prefix: "dagster"
          Environment:
            - Name: DAGSTER_HOME
              Value: "/opt/dagster/dagster_home/"
            - Name: DAGSTER_POSTGRES_HOST
              Value: !Ref DatabaseEndpoint
            - Name: DAGSTER_POSTGRES_USER
              Value: !Ref DBUsername
            - Name: DAGSTER_POSTGRES_DB
              Value: !Ref DBName
            - Name: DAGSTER_POSTGRES_PORT
              Value: !Ref DBPort
            - Name: PYTHONLEGACYWINDOWSSTDIO
              Value: "utf8.env"
            - Name: DAGSTER_CODE_SERVER_TASK
              Value: !GetAtt CodeServerTaskDefinition.TaskDefinitionArn
            - Name: DAGSTER_GRPC_TIMEOUT_SECONDS
              Value: !Ref DagsterGRPCTimeout
          Secrets:
            - Name: DAGSTER_POSTGRES_PASSWORD
              ValueFrom: !Ref DBPasswordArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DagitTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !If
        - HasEnvironment
        - !Sub "DagitTask-${Environment}"
        - "DagitTask"
      ExecutionRoleArn: !GetAtt DagitTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt DagitTaskRole.Arn
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref DagitCpu
      Memory: !Ref DagitMemory
      ContainerDefinitions:
        - Name: dagit
          Image: !Ref DagitImagePath
          Memory: !Ref DagitMemory
          EntryPoint:
            - "dagster-webserver"
            - "-h"
            - "0.0.0.0"
            - "-p"
            - "3000"
            - "-w"
            - "workspace.yaml"
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
              Name: "3000"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DagitLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-create-group: true
              awslogs-stream-prefix: "dagit"
          Environment:
            - Name: DAGSTER_POSTGRES_HOST
              Value: !Ref DatabaseEndpoint
            - Name: DAGSTER_POSTGRES_USER
              Value: !Ref DBUsername
            - Name: DAGSTER_POSTGRES_DB
              Value: !Ref DBName
            - Name: DAGSTER_POSTGRES_PORT
              Value: !Ref DBPort
            - Name: DAGSTER_CODE_SERVER_TASK
              Value: !GetAtt CodeServerTaskDefinition.TaskDefinitionArn
            - Name: PYTHONLEGACYWINDOWSSTDIO
              Value: "utf8.env"
            - Name: DAGSTER_GRPC_TIMEOUT_SECONDS
              Value: !Ref DagsterGRPCTimeout
          Secrets:
            - Name: DAGSTER_POSTGRES_PASSWORD
              ValueFrom: !Ref DBPasswordArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CodeServerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !If
        - HasEnvironment
        - !Sub "CodeServerTask-${Environment}"
        - "CodeServerTask"
      ExecutionRoleArn: !GetAtt CodeServerTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt CodeServerTaskRole.Arn
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref CodeServerCpu
      Memory: !Ref CodeServerMemory
      ContainerDefinitions:
        - Name: user_code
          Image: !Ref UserCode1ImagePath
          RepositoryCredentials:
            CredentialsParameter: "arn:aws:secretsmanager:eu-west-2:260477567664:secret:dockerhub-sysadmin-credentials-5Lb3FI"
          Memory: !Ref CodeServerMemory
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
              Name: "4000"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref CodeServerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-create-group: true
              awslogs-stream-prefix: "dagster-user-code"
          Secrets:
            - Name: HASH_SECRET_KEY
              ValueFrom: !Ref HashSecretArn
            - Name: DAGSTER_POSTGRES_PASSWORD
              ValueFrom: !Ref DBPasswordArn
          Environment:
            - Name: CODE_FOLDER
              Value: !Ref CodeServerPipelineFolder
            - Name: REPO_LOCATION
              Value: !Ref CodeServerPipelineRepoLocation
            - Name: PYTHONLEGACYWINDOWSSTDIO
              Value: "utf8.env"
            - Name: DAGSTER_POSTGRES_HOST
              Value: !Ref DatabaseEndpoint
            - Name: DAGSTER_POSTGRES_USER
              Value: !Ref DBUsername
            - Name: DAGSTER_POSTGRES_DB
              Value: !Ref DBName
            - Name: DAGSTER_POSTGRES_PORT
              Value: !Ref DBPort
            - Name: 903_WILDCARDS
              Value: "*.csv"
            - Name: DAGSTER_CURRENT_IMAGE
              Value: !Ref UserCode1ImagePath
            - Name: WORKSPACE_LOCATION
              Value: !Ref WorkspaceLocation
            - Name: INPUT_LOCATION
              Value: !Ref InputLocation
            - Name: SHARED_LOCATION
              Value: !Ref OutputLocation
            - Name: EXTERNAL_DATA_LOCATION
              Value: !Ref ExternalDataLocation
            - Name: CLEAN_SCHEDULE
              Value: !Ref CleanPipelineSchedule
            - Name: REPORTS_SCHEDULE
              Value: !Ref ReportsPipelineSchedule
            - Name: ALLOWED_DATASETS
              Value: !Ref AllowedDatasets
            - Name: REGION_CONFIG
              Value: !Ref RegionConfig
            - Name: CONFIG_SCHEDULE
              Value: !Ref ConfigSchedule
            - Name: SENSOR_MIN_INTERVAL
              Value: !Ref SensorMinimumInterval
            - Name: DAGSTER_GRPC_TIMEOUT_SECONDS
              Value: !Ref DagsterGRPCTimeout
            - Name: HASH_SECRET_VERSION
              Value: !Ref HashSecretVersion
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DagsterDaemonService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref DagsterCluster
      DesiredCount: 1
      LaunchType: !Ref DaemonLaunchType
      TaskDefinition: !Ref DagsterDaemonTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref DaemonSecurityGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ServiceDiscoveryNamespaceArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DagitService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref DagsterCluster
      DesiredCount: 0
      LaunchType: !Ref DagitLaunchType
      TaskDefinition: !Ref DagitTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
           - !Ref DagitSecurityGroup
      ServiceRegistries:
        - RegistryArn: !GetAtt DagsterWebserverDiscoveryService.Arn
          ContainerName: dagit
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ServiceDiscoveryNamespaceArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CodeServerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref DagsterCluster
      DesiredCount: 1
      LaunchType: !Ref CodeServerLaunchType
      TaskDefinition: !Ref CodeServerTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref CodeServerSecurityGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref ServiceDiscoveryNamespaceArn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !If
              - HasEnvironment
              - !Sub "dagster-daemon-code-service-map-${Environment}"
              - "dagster-daemon-code-service-map"
            awslogs-region: !Ref AWS::Region
            awslogs-create-group: true
            awslogs-stream-prefix: "dagster"
        Services:
          - DiscoveryName: user_code
            PortName: "4000"
            ClientAliases:
              - DnsName: user_code
                Port: 4000
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DatabaseEndpointAddress:
    Description: Endpoint Address for the Database
    Value: !Ref DatabaseEndpoint
  ECSClusterName:
    Description: ARN for the ECS Cluster running dagster
    Value: !Ref DagsterCluster
  DaemonServiceName:
    Description: Name for the Dagster Daemon Service
    Value: !GetAtt DagsterDaemonService.Name
  DaemonServiceARN:
    Description: ARN for the Dagster Daemon Service
    Value: !Ref DagsterDaemonService
  DagitServiceName:
    Description: Name for the Dagit Service
    Value: !GetAtt DagitService.Name
  DagitServiceARN:
    Description: ARN for the Dagit Service
    Value: !Ref DagitService
  CodeServerServiceName:
    Description: Name for the Dagit Service
    Value: !GetAtt CodeServerService.Name
  CodeServerServiceARN:
    Description: ARN for the Dagit Service
    Value: !Ref CodeServerService
  DagsterWebserverDiscoveryServiceArn:
    Description: Service Discovery Service for the Dagster Webserver
    Value: !GetAtt DagsterWebserverDiscoveryService.Arn
  DagitSecurityGroupId:
    Description: Security group ID for the Dagster webserver
    Value: !Ref DagitSecurityGroup